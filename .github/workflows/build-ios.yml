name: LiquidSSH preserved-archive recovery
run-name: LiquidSSH native IPA recovery (20261005T133822Z)

# Recovery branch only. No checkout or cleanup: native source on the runner is
# untracked and must not be removed by actions/checkout's default clean step.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquidssh-native-signing
  cancel-in-progress: false

jobs:
  sign-preserved-native-archive:
    runs-on: [self-hosted, macOS, ios-builder]
    timeout-minutes: 10
    env:
      RELEASE_DIR: /Users/rileyseaburg/LiquidSSH-distribution/20261005T133822Z
    steps:
      - name: Verify preserved artifacts before using signing access
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = rileyseaburg
          cd "$RELEASE_DIR"
          test "$(shasum -a 256 resume-export.sh | cut -d ' ' -f 1)" = 192f3638758d57344ae8b331ecac3873314f1512e0de5abdb5b037616383f0f2
          test "$(shasum -a 256 ExportOptions-development-auto.plist | cut -d ' ' -f 1)" = 99b0d62947b072a98aa582c25c8f28ac87a9f1b4af481effb4a0cd70dc2fe9d6
          test "$(shasum -a 256 LiquidSSH.xcarchive/Products/Applications/LiquidSSH.app/LiquidSSH | cut -d ' ' -f 1)" = 25b2729f33288356395b0ccc4baae7095acf3226a38f55779f7410112272ec17
          bash -n resume-export.sh
          cd source
          shasum -a 256 -c ../built-source-sha256.txt

      - name: Unlock through the existing CI credential mechanism
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYCHAIN_PASSWORD"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$HOME/Library/Keychains/login.keychain-db"

      - name: Export and verify development IPA before NAS staging
        shell: bash
        run: |
          set -euo pipefail
          bash "$RELEASE_DIR/resume-export.sh"

      - name: Preserve recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidssh-native-recovery-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            /Users/rileyseaburg/LiquidSSH-distribution/20261005T133822Z/export-development-*.log
            /Users/rileyseaburg/LiquidSSH-distribution/20261005T133822Z/signature-*.log
            /Users/rileyseaburg/LiquidSSH-distribution/20261005T133822Z/certificate-*.log
            /Users/rileyseaburg/LiquidSSH-distribution/20261005T133822Z/staging-*.txt
